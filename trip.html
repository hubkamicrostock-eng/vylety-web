<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Výlet</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; display: flex; flex-direction: column; height: 100vh; }
    header {
      background: #2E7D32; color: #fff; padding: 12px 20px;
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    header a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.9rem; }
    header a:hover { color: #fff; }
    header h1 { font-size: 1.1rem; flex: 1; }
    #map { flex: 1; min-height: 0; }
    #info-panel {
      background: #fff; padding: 14px 20px; flex-shrink: 0;
      border-top: 1px solid #e0e0e0; display: flex; align-items: center; gap: 0; flex-wrap: wrap;
    }
    .stat { flex: 1; min-width: 80px; text-align: center; padding: 4px 0; }
    .stat-value { font-size: 1rem; font-weight: bold; color: #2E7D32; }
    .stat-label { font-size: 0.72rem; color: #888; }
    #controls {
      background: #fff; padding: 10px 20px; flex-shrink: 0;
      border-top: 1px solid #e0e0e0; display: flex; gap: 10px; align-items: center;
    }
    .btn {
      padding: 8px 18px; border: none; border-radius: 8px; cursor: pointer;
      font-size: 0.9rem; font-weight: 600; transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #2E7D32; color: #fff; }
    .btn-secondary { background: #f0f0f0; color: #333; }
    .btn-danger { background: #C62828; color: #fff; }
    #speed-control { display: flex; align-items: center; gap: 8px; margin-left: auto; font-size: 0.85rem; color: #555; }
    #speed-control select { padding: 4px 8px; border-radius: 6px; border: 1px solid #ccc; }
    #progress { flex: 1; height: 4px; background: #e0e0e0; border-radius: 2px; overflow: hidden; margin: 0 12px; }
    #progress-bar { height: 100%; background: #2E7D32; width: 0%; transition: width 0.1s; }
    /* Lightbox */
    #lightbox {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      z-index: 2000; justify-content: center; align-items: center;
    }
    #lightbox.active { display: flex; }
    #lightbox img { max-width: 90vw; max-height: 80vh; border-radius: 8px; }
    #lightbox-close {
      position: absolute; top: 20px; right: 24px; color: #fff; font-size: 2rem;
      cursor: pointer; line-height: 1; background: none; border: none;
    }
    #lightbox-caption { position: absolute; bottom: 30px; color: #fff; font-size: 0.95rem; text-align: center; }
    .loading { padding: 40px; text-align: center; color: #888; }
  </style>
</head>
<body>
  <header>
    <a href="index.html">← Zpět</a>
    <h1 id="trip-title">Načítám...</h1>
  </header>

  <div id="map"><div class="loading">Načítám mapu...</div></div>

  <div id="info-panel">
    <div class="stat"><div class="stat-value" id="stat-dist">–</div><div class="stat-label">Vzdálenost</div></div>
    <div class="stat"><div class="stat-value" id="stat-dur">–</div><div class="stat-label">Doba</div></div>
    <div class="stat"><div class="stat-value" id="stat-speed">–</div><div class="stat-label">Ø rychlost</div></div>
    <div class="stat"><div class="stat-value" id="stat-photos">–</div><div class="stat-label">Fotek</div></div>
    <div class="stat"><div class="stat-value" id="stat-date">–</div><div class="stat-label">Datum</div></div>
  </div>

  <div id="controls">
    <button class="btn btn-primary" id="btn-play">▶ Přehrát</button>
    <button class="btn btn-secondary" id="btn-pause" disabled>⏸ Pauza</button>
    <button class="btn btn-secondary" id="btn-reset" disabled>↺ Reset</button>
    <div id="progress"><div id="progress-bar"></div></div>
    <div id="speed-control">
      <label for="speed-select">Rychlost:</label>
      <select id="speed-select">
        <option value="5">5×</option>
        <option value="10" selected>10×</option>
        <option value="20">20×</option>
        <option value="50">50×</option>
      </select>
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox">
    <button id="lightbox-close">✕</button>
    <img id="lightbox-img" src="" alt="" />
    <div id="lightbox-caption"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="map.js"></script>
  <script src="animation.js"></script>
</body>
</html>
