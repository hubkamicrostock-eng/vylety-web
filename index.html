<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moje výlety</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; }
    header {
      background: #2E7D32; color: #fff; padding: 16px 24px;
      display: flex; align-items: center; gap: 12px;
    }
    header h1 { font-size: 1.4rem; }
    .container { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
    .trips-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .trip-card {
      background: #fff; border-radius: 12px; padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08); cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s; text-decoration: none; color: inherit;
      display: block;
    }
    .trip-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.13); }
    .trip-card h2 { font-size: 1.1rem; color: #222; margin-bottom: 4px; }
    .trip-card .date { font-size: 0.85rem; color: #888; margin-bottom: 12px; }
    .trip-stats { display: flex; gap: 16px; flex-wrap: wrap; }
    .trip-stat { display: flex; align-items: center; gap: 5px; font-size: 0.9rem; color: #444; }
    .empty { text-align: center; padding: 60px 20px; color: #888; }
    .empty h2 { margin-bottom: 8px; font-size: 1.2rem; }
    .loading { text-align: center; padding: 60px; color: #888; }
    .trip-card-wrap { position: relative; }
    .btn-delete {
      position: absolute; top: 10px; right: 10px;
      background: rgba(198,40,40,0.08); border: 1px solid rgba(198,40,40,0.2);
      color: #c62828; border-radius: 6px; padding: 4px 8px;
      cursor: pointer; font-size: 0.78rem; opacity: 0; transition: opacity 0.15s;
      z-index: 1;
    }
    .trip-card-wrap:hover .btn-delete { opacity: 1; }
    .btn-delete:hover { background: #c62828; color: #fff; }
  </style>
</head>
<body>
  <header>
    <span style="font-size:1.8rem">🥾</span>
    <h1 style="flex:1">Moje výlety</h1>
    <a href="new-trip.html" style="background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.4);color:#fff;border-radius:8px;padding:7px 14px;text-decoration:none;font-size:0.88rem;white-space:nowrap;">+ Nový výlet</a>
  </header>
  <div class="container">
    <div id="content" class="loading">Načítám výlety...</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://krtntseehlbrxvoiwflp.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtydG50c2VlaGxicnh2b2l3ZmxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3NjY4OTcsImV4cCI6MjA5MzM0Mjg5N30.kltSaq1zpsBEWmTeUh5bXYbxLEHS2e7NVqs85mU0UE8';

    async function loadTrips() {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/trips?select=*,photos(*)&order=started_at.desc`, {
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
      });
      return res.json();
    }

    function formatDistance(km) {
      return km < 1 ? `${Math.round(km * 1000)} m` : `${km.toFixed(1)} km`;
    }

    function formatDuration(sec) {
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
      return h > 0 ? `${h}h ${m}min` : `${m} min`;
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('cs-CZ', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    async function init() {
      const content = document.getElementById('content');
      try {
        const trips = await loadTrips();
        if (!trips.length) {
          content.innerHTML = '<div class="empty"><h2>Zatím žádné výlety</h2><p>Nahraj výlet z mobilní aplikace.</p></div>';
          return;
        }
        content.innerHTML = `<div class="trips-grid">${trips.map(t => `
          <div class="trip-card-wrap">
            <a class="trip-card" href="trip.html?id=${t.id}">
              <h2>${t.name || 'Výlet'}</h2>
              <div class="date">${formatDate(t.started_at)}</div>
              <div class="trip-stats">
                <span class="trip-stat">📍 ${formatDistance(t.distance_km)}</span>
                <span class="trip-stat">⏱ ${formatDuration(t.duration_seconds)}</span>
                ${(t.avg_speed_kmh||0) > 0 ? `<span class="trip-stat">🚶 ${(t.avg_speed_kmh).toFixed(1)} km/h</span>` : ''}
                <span class="trip-stat">📷 ${(t.photos || []).length}</span>
              </div>
            </a>
            <button class="btn-delete" data-id="${t.id}" data-name="${(t.name||'Výlet').replace(/"/g,'&quot;')}">🗑 Smazat</button>
          </div>
        `).join('')}</div>`;
      } catch (e) {
        content.innerHTML = `<div class="empty"><h2>Chyba načítání</h2><p>${e.message}</p></div>`;
      }
    }

    async function deleteTrip(id, name) {
      if (!confirm(`Opravdu smazat výlet "${name}"? Tato akce je nevratná.`)) return;
      const res = await fetch(`${SUPABASE_URL}/rest/v1/trips?id=eq.${id}`, {
        method: 'DELETE',
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, Prefer: 'return=minimal' }
      });
      if (res.ok) {
        const wrap = document.querySelector(`.btn-delete[data-id="${id}"]`)?.closest('.trip-card-wrap');
        if (wrap) wrap.remove();
      } else {
        alert('Smazání selhalo (' + res.status + ').');
      }
    }

    document.addEventListener('click', e => {
      const btn = e.target.closest('.btn-delete');
      if (btn) { e.preventDefault(); deleteTrip(btn.dataset.id, btn.dataset.name); }
    });

    init();
  </script>
</body>
</html>
